name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate architecture and version tag
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Run safety checks
        run: zsh test.sh
      - name: Build signed app and ZIP
        run: zsh package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MacCacheCare-macOS-arm64.zip dist/SHA256SUMS.txt \
            --verify-tag --title "轻缓存 $GITHUB_REF_NAME" \
            --notes-file "releases/$GITHUB_REF_NAME.md"
